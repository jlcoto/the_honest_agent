# honest-agent settings: one target per agent being evaluated, like the targets in a dbt profile.
# Secrets never go here: a target names the environment variable holding its token
# (bearer_token_env), and the token itself stays in .env.
#
#   honest-agent run                       # the default target (demo)
#   honest-agent run --target motherduck   # another target
#   honest-agent notify --target motherduck --webhook-url ...   # Slack alert on its latest run
#
# A flag or environment variable still overrides any setting here, for one-off runs.

results_path: ./honest_agent_results/results.duckdb

default_target: demo

targets:
  # The bundled demo server: no account needed.
  demo:
    mcp_command: uv run python mcp_server/server.py
    evals_dir: evals

  # MotherDuck's hosted MCP server. Use a read-only token: the server also offers tools
  # that write to and delete from your account.
  motherduck:
    mcp_url: https://api.motherduck.com/mcp
    bearer_token_env: MOTHERDUCK_TOKEN
    evals_dir: evals_motherduck
    # The agent explores (databases, tables, columns) before it queries, so 5 steps is
    # too few here.
    max_tool_steps: 10

  # A Snowflake-managed MCP server (see README.md). Replace the placeholders with yours.
  snowflake:
    mcp_url: https://<account_identifier>.snowflakecomputing.com/api/v2/databases/agent_quiz_demo/schemas/public/mcp-servers/agent_quiz_mcp
    bearer_token_env: SNOWFLAKE_MCP_TOKEN
    evals_dir: evals_snowflake
