version: 1

# Same two quizzes as ../quizzes/example_quiz.yml, but pointed at MotherDuck's
# own official MCP server (`uvx mcp-server-motherduck`) instead of our
# bundled demo server -- its tool is `execute_query` (sql field: `sql`), not
# `query_warehouse`. Data is a byte-identical copy of ../warehouse.duckdb,
# loaded into a MotherDuck database (see TODO.md/README for how it got
# there). Same quiz IDs on purpose, so results from both targets land
# side by side in the same results.duckdb, comparable by quiz_id.
#
# Run with:
#   honest-agent run --quizzes-dir quizzes_motherduck \
#     --mcp-command "uvx mcp-server-motherduck --read-write --db-path md:agent_quiz_demo" \
#     --agent-name motherduck
#
# --read-write is required unless your MOTHERDUCK_TOKEN is specifically a
# read-scaling token -- see README.md's "Connecting to a real MotherDuck
# account" section for why.
#
# Quizzes are grouped by category; each group's settings apply to its tests
# unless a test sets its own. These quizzes keep explicit ids so their result
# history carries over; a new quiz can leave id out and get one from its title.

quizzes:
  - category: finance
    grading:
      method: extract_match
      min_score: 0.8
    provenance:
      sql_fields:
        execute_query: sql
      min_score: 0.7
    tags: [smoke, provenance, motherduck]
    tests:
      - id: q_revenue_1996
        title: Total revenue in 1996
        prompt: >
          What was our total revenue in 1996? Query the warehouse to find out,
          and give me just the number.
        expected_answer: "311928357.78"
        grading:
          # fct_revenue_by_year.revenue is an unrounded raw sum (...7805); the
          # agent faithfully reporting that isn't a real accuracy failure.
          tolerance: 0.01
        provenance:
          expected_sources: [fct_revenue_by_year]

      - id: q_order_count_1996
        title: Orders placed in 1996
        prompt: >
          How many orders were placed in 1996? Query the warehouse to find out,
          and give me just the number.
        expected_answer: "2297"
        provenance:
          expected_sources: [orders]

  - category: orders
    grading:
      method: llm_judge
      min_score: 0.8
    provenance:
      sql_fields:
        execute_query: sql
      min_score: 0.7
    tags: [smoke, provenance, motherduck]
    tests:
      - id: q_order_count_2025
        title: Orders placed in 2025
        prompt: >
          How many orders were placed in 2025? Query the warehouse to find out,
          and give me just the number.
        expected_answer: "3000"
        provenance:
          expected_sources: [revenue]

      - id: q_order_count_2025_test_b
        title: Orders placed in 2025
        prompt: >
          How many orders were placed in 2025? Query the warehouse to find out,
          and give me just the number.
        expected_answer: "2500"
        provenance:
          expected_sources: [orders]
