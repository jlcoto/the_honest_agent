version: 1

# Path B of testing the TPC-H semantic view (see semantic_view_quiz.yml for Path A):
# here the agent has a dedicated MCP tool (query_semantic_view, CORTEX_ANALYST_MESSAGE)
# pointed directly at agent_quiz_demo.public.tpch_semantic_view -- see README.md's
# Snowflake section. Its input is a plain-language `message`, not SQL, and the
# generated SQL comes back inside the *response* (a `statement` field) -- which
# sql_capture.py now checks in addition to the request, so expected_sources still
# works the same way it does for query_warehouse.
#
# No expected_tools declared: even a call that does go through query_semantic_view doesn't
# reliably mean the semantic view was actually referenced -- Cortex Analyst itself sometimes
# generates an equivalent hand-written join instead of `SELECT * FROM SEMANTIC_VIEW(...)`.
# expected_sources is what's actually checking the thing that matters. Revisit expected_tools
# here once there's real experience with how other semantic-layer tools behave, not before.
#
# Run with (MCP_URL/MCP_BEARER_TOKEN read from .env automatically):
#   agent-quiz run --quizzes-dir quizzes_snowflake --select semantic_view_tool

quizzes:
  - id: q_revenue_1996_semantic_view_tool
    prompt: >
      What was our total revenue in 1996? Use the semantic view tool to find
      out, and give me just the number.
    category: finance
    expected_answer: "311928357.78"
    grading:
      method: extract_match
      min_score: 0.8
      tolerance: 0.01
    provenance:
      expected_sources: [tpch_semantic_view]
      expected_database: agent_quiz_demo
      expected_schema: public
      sql_fields:
        query_warehouse: sql
      min_score: 0.7
    tags: [provenance, snowflake, semantic_view_tool]
