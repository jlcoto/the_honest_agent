version: 1

# Same two evals as ../evals/example_eval.yml, but pointed at MotherDuck's
# hosted MCP server instead of our bundled demo server. Data is a byte-identical copy of ../warehouse.duckdb,
# loaded into a MotherDuck database (see TODO.md/README for how it got
# there). Same eval IDs on purpose, so results from both targets land
# side by side in the same results.duckdb, comparable by eval_id.
#
# Run with `honest-agent run --target motherduck` (see ../honest_agent_config.yml
# and README.md's "Connecting to a real MotherDuck account").
#
# Evals are grouped by category; each group's settings apply to its tests
# unless a test sets its own. These evals keep explicit ids so their result
# history carries over; a new eval can leave id out and get one from its title.

evals:
  - category: finance
    grading:
      method: extract_match
      min_score: 0.8
    provenance:
      min_score: 0.7
    tags: [smoke, provenance, motherduck]
    tests:
      - id: q_revenue_1996
        title: Total revenue in 1996
        prompt: >
          What was our total revenue in 1996? Query the warehouse to find out,
          and give me just the number.
        expected_answer: "311928357.78"
        grading:
          # Revenue is an unrounded sum (...7805); the agent faithfully
          # reporting that isn't a real accuracy failure.
          tolerance: 0.01
        provenance:
          expected_sources: [lineitem, orders]

      - id: q_order_count_1996
        title: Orders placed in 1996
        prompt: >
          How many orders were placed in 1996? Query the warehouse to find out,
          and give me just the number.
        expected_answer: "2297"
        provenance:
          expected_sources: [orders]

  - category: orders
    grading:
      method: llm_judge
      min_score: 0.8
    provenance:
      min_score: 0.7
    tags: [smoke, provenance, motherduck]
    tests:
      - id: q_order_count_2025
        title: Orders placed in 2025
        prompt: >
          How many orders were placed in 2025? Query the warehouse to find out,
          and give me just the number.
        expected_answer: "3000"
        provenance:
          expected_sources: [revenue]

      - id: q_order_count_2025_test_b
        title: Orders placed in 2025
        prompt: >
          How many orders were placed in 2025? Query the warehouse to find out,
          and give me just the number.
        expected_answer: "2500"
        provenance:
          expected_sources: [orders]
