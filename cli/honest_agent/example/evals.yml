version: 1

# Six evals over DuckDB's TPC-H sample data, showing every grading method and the
# provenance checks. Three pass, and three are meant to fall short, each in its own
# way: see README.md. Every expected answer was checked against the seeded data.

evals:
  # Settings on a group (grading, provenance, ...) apply to all of its tests, and
  # a test can override any of them, key by key: see top_nations_last_year.
  - category: customers
    grading:
      method: contains          # the expected answer must appear in the agent's answer
    provenance:
      min_score: 0.7
    tests:
      - id: top_segment
        title: Market segment with the most customers
        prompt: Which market segment has the most customers?
        expected_answer: BUILDING
        provenance:
          expected_sources: [customer]

      # Meant to fail accuracy: "last year" is ambiguous. The data ends in August
      # 1998, so the agent may pick 1998 (or today's last year, with no data),
      # while the expected answer is 1997, the last full year.
      - id: top_nations_last_year
        title: Nations with the most orders last year
        prompt: Which 5 nations placed the most orders last year?
        expected_answer: "CANADA, INDONESIA, EGYPT, IRAN and JAPAN (orders placed in 1997, the last full year in the data)."
        grading:
          # Overrides the group's `contains`: a list in any wording needs a judge.
          method: llm_judge     # a model scores the answer from 0 to 1, with a reason
          min_score: 0.8
        provenance:
          expected_sources: [orders, customer, nation]

  - category: sales
    grading:
      method: extract_match     # a model pulls the value out of the answer; code compares it
      min_score: 0.8
    provenance:
      min_score: 0.7
    tests:
      # May pass or fail from run to run: the agent can count "revenue in 1997" by
      # the orders' date (placed in 1997: lineitem + orders, 307992639.49, expected)
      # or by the line items' ship date (lineitem only, 310330373.70). An eval that
      # flips between runs usually means its question allows more than one reading.
      - id: revenue_1997
        title: Revenue in 1997
        prompt: What was our revenue in 1997, net of discounts and before tax?
        expected_answer: "307992639.49"
        grading:
          tolerance: 0.01       # an absolute difference that still counts as equal
        provenance:
          expected_sources: [lineitem, orders]

      - id: avg_order_total_1996
        title: Average order total in 1996
        prompt: What was the average total price of the orders placed in 1996?
        expected_answer: "141264.36"
        grading:
          tolerance_percent: 0.01   # 1% of the expected value
        provenance:
          # Where the table must live, not only its name. The agent writes bare
          # names (`from orders`); the target's default_database/default_schema say
          # where those run.
          expected_database: warehouse
          expected_schema: main
          expected_sources: [orders]

      # No tolerance: the value must match exactly.
      # Meant to fail provenance: orders alone answers this, so a correct answer
      # still scores 1 of 2 expected sources (50% < 70%). It passes if the agent
      # happens to run a select on lineitem along the way.
      - id: order_total_1995
        title: Total price of the orders placed in 1995
        prompt: What was the total price of all the orders placed in 1995?
        expected_answer: "316087761.96"
        provenance:
          expected_sources: [orders, lineitem]

  - category: operations
    grading:
      method: llm_judge
      min_score: 0.8
    tests:
      # TRUCK and MAIL are tied. Spotting the tie passes; naming only one gets
      # partial credit (about 0.5), below the 0.8 minimum. No expected sources:
      # provenance isn't checked.
      - id: top_ship_mode_1995
        title: Ship mode with the most line items in 1995
        prompt: Which ship mode had the most line items with a ship date in 1995?
        expected_answer: "TRUCK and MAIL are tied, with 1307 line items each."
