[project]
name = "agent-quiz"
version = "0.1.0"
description = "CLI that runs LLM quizzes against an agent, grades accuracy/provenance, and stores the results."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "duckdb>=0.10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# The MCP SDK itself requires Python >=3.10; only needed for `agent-quiz run`
# (report/notify/export/logs don't need it).
mcp = ["mcp>=1.0; python_version >= '3.10'"]
# Only needed to quiz or grade with OpenAI (GPT) models.
openai = ["openai>=1.40"]
lint = [
    "ruff>=0.16.7",
]

[project.scripts]
agent-quiz = "agent_quiz_cli.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_quiz_cli*"]

# The prebuilt report UI (built from ../ui with `npm run build`).
[tool.setuptools.package-data]
agent_quiz_cli = ["report_ui/**/*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
