[project]
name = "honest-agent"
version = "0.1.0"
description = "CLI that runs LLM evals against an agent, grades accuracy/provenance, and stores the results."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Each range starts at the version tested and stops before the next major one (the next
    # minor for 0.x tools like ruff), so installs never get an untested major release.
    "click>=8.5,<9",
    "pyyaml>=6.0,<7",
    "duckdb>=1.5,<2",
    "python-dotenv>=1.2,<2",
    # The MCP SDK (open Model Context Protocol), used by `run` to reach the agent's tools.
    # 2.x is needed for its `Client` class.
    "mcp>=2.2,<3",
    # Model SDKs: both installed, each imported only when one of its models is used.
    "anthropic>=1.5,<2",
    "openai>=3.23,<4",
    "sqlglot>=30.21,<31",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<10"]
lint = [
    "ruff>=0.16.7,<0.17",
]

[project.scripts]
honest-agent = "honest_agent.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["honest_agent*"]

# The prebuilt report UI (built from ../ui with `npm run build`).
[tool.setuptools.package-data]
honest_agent = ["report_ui/**/*", "example/*", "skill/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
