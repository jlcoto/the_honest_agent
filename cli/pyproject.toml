[project]
name = "agent-quiz"
version = "0.1.0"
description = "CLI that runs LLM quizzes against an agent, grades accuracy/provenance, and stores the results."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "duckdb>=0.10.0",
    "python-dotenv>=1.0",
    # The MCP SDK (open Model Context Protocol), used by `run` to reach the agent's tools.
    # 2.x is needed for its `Client` class.
    "mcp>=2.0",
    # Model SDKs: both installed, each imported only when one of its models is used.
    "anthropic>=0.40.0",
    "openai>=1.40",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
lint = [
    "ruff>=0.16.7",
]

[project.scripts]
agent-quiz = "agent_quiz_cli.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_quiz_cli*"]

# The prebuilt report UI (built from ../ui with `npm run build`).
[tool.setuptools.package-data]
agent_quiz_cli = ["report_ui/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
